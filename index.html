<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio to MySQL Project</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; text-align: center; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; color: green; }
    </style>
</head>
<body>

    <div class="container">
        <h2>My Google AI Project Website</h2>
        <p>Clicking the button below will save the JSON data to the MySQL database.</p>
        
        <button onclick="sendDataToDatabase()">Save data in MySQL</button>
        <div id="status"></div>
    </div>

    <script>
        async function sendDataToDatabase() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Sending data...";

            try {
                // 读取 data.json 文件
                const responseJson = await fetch('data.json'); 
                const jsonData = await responseJson.json();

                // 发送数据到 Render 后端
                const result = await fetch('/api/save-json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                const data = await result.json();
                statusDiv.innerText = "✅ JSON data saved successfully to Aiven Cloud!";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ An error occurred! (Check if the backend server is running)";
            }
        }
    </script>
</body>
</html>
